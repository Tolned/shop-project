{% extends 'base.html' %}
{% block title %}Профиль{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="mb-4">Профиль пользователя</h1>
        <div class="card">
            <div class="card-body">
                <h3>{{ user.username }}</h3>
                <p><strong>Email:</strong> {{ user.email }}</p>
                {% if user.phone %}<p><strong>Телефон:</strong> {{ user.phone }}</p>{% endif %}
                {% if user.country %}<p><strong>Страна:</strong> {{ user.country }}</p>{% endif %}
                <a href="{% url 'users:logout' %}" class="btn btn-danger">Выйти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
