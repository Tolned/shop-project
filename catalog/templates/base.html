<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <!-- Подключаем Bootstrap для привлекательного вида -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <!-- Чек-лист: Подшаблон создан и подключен во все шаблоны -->
        {% include 'includes/menu.html' %}
    </header>

    <main class="container mt-4">
        <!-- Чек-лист: Шаблон содержит все общие блоки, все шаблоны наследуют его -->
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-light text-center p-3 mt-5 border-top">
        <p class="mb-0">&copy; 2026 Магазин. Все права защищены.</p>
    </footer>
</body>
</html>
