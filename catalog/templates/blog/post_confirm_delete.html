{% extends 'base.html' %}
{% block title %}Удалить статью{% endblock %}
{% block content %}
<h1>Удалить "{{ post.title }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
