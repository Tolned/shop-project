{% extends 'base.html' %}
{% block title %}{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} статью{% endblock %}
{% block content %}
<h1 class="mb-4">{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} статью</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
